<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cartão de visita digital do Dr. Luis Fernando Delgadillo Trigo - Médico Pediatra e Neonatologista.">
    <title>Dr. Luis Fernando Delgadillo Trigo - Cartão de Visita Digital</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#2c5aa0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c5aa0;
            --secondary-color: #4a90e2;
            --accent-color: #f8f9fa;
            --text-color: #2c3e50;
            --light-gray: #ecf0f1;
            --border-color: #e1e8ed;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .language-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            border-radius: 25px;
            padding: 8px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .lang-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .lang-btn:hover:not(.active) {
            background: var(--light-gray);
        }

        .business-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-top: 60px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .business-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="50" cy="10" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="10" cy="50" r="1" fill="%23ffffff" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>') repeat;
            opacity: 0.1;
        }

        .profile-photo {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            background-color: var(--primary-color);
            position: relative;
            z-index: 1;
        }

        .doctor-name {
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .specialty {
            font-size: 1.2em;
            opacity: 0.95;
            font-weight: 300;
            position: relative;
            z-index: 1;
        }

        .content {
            padding: 40px 30px;
        }

        .section {
            margin-bottom: 35px;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        .section:nth-child(1) { animation-delay: 0.2s; }
        .section:nth-child(2) { animation-delay: 0.4s; }
        .section:nth-child(3) { animation-delay: 0.6s; }
        .section:nth-child(4) { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            color: var(--primary-color);
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            width: 25px;
            text-align: center;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .contact-item {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--accent-color);
            border-radius: 12px;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background: white;
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .contact-icon {
            width: 45px;
            height: 45px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .contact-text {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .contact-label {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 3px;
        }

        .contact-value {
            font-weight: 600;
            color: var(--text-color);
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            box-shadow: var(--shadow);
            transform: translateX(5px);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -32px;
            top: 25px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 3px solid white;
            box-shadow: 0 0 0 3px var(--border-color);
        }

        .timeline-year {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .timeline-degree {
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 5px;
        }

        .timeline-institution {
            color: #7f8c8d;
            font-size: 0.95em;
        }

        .summary-text {
            text-align: justify;
            color: #555;
            line-height: 1.7;
        }

        .summary-text p + p {
            margin-top: 12px;
        }

        .experience-item {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid var(--secondary-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .experience-item:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .experience-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 20px;
        }

        .experience-position {
            font-weight: 600;
            color: var(--text-color);
            flex: 1;
        }

        .experience-status {
            background: var(--secondary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
            white-space: nowrap;
        }

        .experience-institution {
            color: #7f8c8d;
            font-size: 0.95em;
            font-style: italic;
        }

        .footer {
            text-align: center;
            padding: 30px;
            background: var(--accent-color);
            border-top: 1px solid var(--border-color);
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .hidden {
            display: none;
        }

        .status-message {
            padding: 40px 30px;
            text-align: center;
            color: #7f8c8d;
        }

        .status-message.error {
            color: #b3261e;
        }

        .status-message code {
            background: var(--light-gray);
            padding: 2px 6px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .language-selector {
                top: 10px;
                right: 10px;
            }

            .business-card {
                margin-top: 70px;
            }

            .header {
                padding: 30px 20px;
            }

            .profile-photo {
                width: 120px;
                height: 120px;
                font-size: 36px;
            }

            .doctor-name {
                font-size: 1.8em;
            }

            .specialty {
                font-size: 1.1em;
            }

            .content {
                padding: 30px 20px;
            }

            .contact-info {
                grid-template-columns: 1fr;
            }

            .timeline {
                padding-left: 20px;
            }

            .timeline-item {
                padding: 15px;
            }

            .experience-header {
                flex-direction: column;
                gap: 10px;
            }

            .experience-status {
                align-self: flex-start;
            }
        }

        @media (max-width: 480px) {
            .doctor-name {
                font-size: 1.5em;
            }

            .section-title {
                font-size: 1.2em;
            }
        }

        /* Share Button */
        .share-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .share-fab:hover {
            background: var(--secondary-color);
            transform: scale(1.1) rotate(10deg);
            box-shadow: var(--shadow-hover);
        }

    </style>
</head>
<body>
    <div class="language-selector">
        <button class="lang-btn active" data-lang="pt">PT</button>
        <button class="lang-btn" data-lang="es">ES</button>
    </div>

    <div class="container">
        <div class="business-card">
            <div class="header">
                <div class="profile-photo" id="profile-photo"></div>
                <h1 class="doctor-name" id="doctor-name"></h1>
                <p class="specialty" id="specialty"></p>
            </div>

            <div class="content" id="content">
                <p class="status-message" id="status-message">Carregando…</p>
            </div>

            <div class="footer">
                <p id="footer-text"></p>
            </div>
        </div>
    </div>

    <!-- Botão Flutuante de Compartilhamento -->
    <button class="share-fab" id="share-btn" title="Compartilhar" aria-label="Compartilhar">
        <i class="fas fa-share-alt"></i>
    </button>

    <script>
        (function () {
            'use strict';

            // O conteúdo vive em content/*.json.
            // Para editar sem mexer em código, use /admin (Decap CMS).
            const CONTENT_FILES = {
                identidade: 'content/identidade.json',
                resumo: 'content/resumo.json',
                contatos: 'content/contatos.json',
                formacao: 'content/formacao.json',
                experiencias: 'content/experiencias.json'
            };

            // Títulos das seções: fixos no código, não precisam de edição.
            const TITULOS = {
                resumo: { pt: 'RESUMO PROFISSIONAL', es: 'RESUMEN PROFESIONAL' },
                contatos: { pt: 'CONTATOS', es: 'CONTACTOS' },
                formacao: { pt: 'FORMAÇÃO ACADÊMICA', es: 'FORMACIÓN ACADÉMICA' },
                experiencias: { pt: 'EXPERIÊNCIAS PROFISSIONAIS', es: 'EXPERIENCIAS PROFESIONALES' }
            };

            const RODAPE = {
                pt: 'Todos os direitos reservados.',
                es: 'Todos los derechos reservados.'
            };

            const ICONS = {
                email: 'fas fa-envelope',
                telefone: 'fas fa-phone',
                whatsapp: 'fab fa-whatsapp',
                instagram: 'fab fa-instagram',
                linkedin: 'fab fa-linkedin-in',
                lattes: 'fas fa-file-alt',
                site: 'fas fa-globe'
            };

            const langButtons = document.querySelectorAll('.lang-btn');
            const contentEl = document.getElementById('content');
            const footerEl = document.getElementById('footer-text');
            const statusEl = document.getElementById('status-message');

            let data = null;
            let lang = localStorage.getItem('preferredLanguage') === 'es' ? 'es' : 'pt';

            function esc(value) {
                return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
                });
            }

            // Campo de texto bilingue: { pt: "...", es: "..." }
            function pick(field) {
                if (field == null) return '';
                if (typeof field === 'string') return field;
                return field[lang] || field.pt || field.es || '';
            }

            // Campo de texto bilingue "achatado": base_pt / base_es.
            // Se a versão no idioma atual estiver vazia, usa o português.
            function tr(obj, base) {
                if (!obj) return '';
                const pt = obj[base + '_pt'] || '';
                const es = obj[base + '_es'] || '';
                return lang === 'es' ? (es || pt) : (pt || es);
            }

            function sectionTitle(icon, text) {
                const h2 = document.createElement('h2');
                h2.className = 'section-title';
                h2.innerHTML = '<i class="' + icon + ' section-icon" aria-hidden="true"></i><span>' + esc(text) + '</span>';
                return h2;
            }

            function newSection() {
                const section = document.createElement('div');
                section.className = 'section';
                return section;
            }

            function buildContatos(contatos) {
                const section = newSection();
                section.appendChild(sectionTitle('fas fa-address-book', pick(TITULOS.contatos)));

                const grid = document.createElement('div');
                grid.className = 'contact-info';

                (contatos.itens || []).forEach(function (item) {
                    const link = item.link || '#';
                    const a = document.createElement('a');
                    a.className = 'contact-item';
                    a.href = link;
                    if (/^https?:/i.test(link)) {
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                    }

                    const icon = document.createElement('div');
                    icon.className = 'contact-icon';
                    icon.innerHTML = '<i class="' + (ICONS[item.tipo] || ICONS.site) + '" aria-hidden="true"></i>';

                    const text = document.createElement('div');
                    text.className = 'contact-text';

                    const label = document.createElement('div');
                    label.className = 'contact-label';
                    label.textContent = tr(item, 'rotulo');

                    const value = document.createElement('div');
                    value.className = 'contact-value';
                    value.textContent = tr(item, 'valor');

                    text.appendChild(label);
                    text.appendChild(value);
                    a.appendChild(icon);
                    a.appendChild(text);
                    grid.appendChild(a);
                });

                section.appendChild(grid);
                return section;
            }

            function buildResumo(resumo) {
                const section = newSection();
                section.appendChild(sectionTitle('fas fa-info-circle', pick(TITULOS.resumo)));

                const wrapper = document.createElement('div');
                wrapper.className = 'summary-text';

                (resumo.paragrafos || []).forEach(function (paragrafo) {
                    const p = document.createElement('p');
                    p.textContent = pick(paragrafo);
                    wrapper.appendChild(p);
                });

                section.appendChild(wrapper);
                return section;
            }

            function buildFormacao(formacao) {
                const section = newSection();
                section.appendChild(sectionTitle('fas fa-graduation-cap', pick(TITULOS.formacao)));

                const timeline = document.createElement('div');
                timeline.className = 'timeline';

                (formacao.itens || []).forEach(function (item) {
                    const el = document.createElement('div');
                    el.className = 'timeline-item';

                    if (item.ano) {
                        const ano = document.createElement('div');
                        ano.className = 'timeline-year';
                        ano.textContent = item.ano;
                        el.appendChild(ano);
                    }

                    const curso = document.createElement('div');
                    curso.className = 'timeline-degree';
                    curso.textContent = tr(item, 'curso');
                    el.appendChild(curso);

                    if (item.instituicao) {
                        const inst = document.createElement('div');
                        inst.className = 'timeline-institution';
                        inst.textContent = item.instituicao;
                        el.appendChild(inst);
                    }

                    timeline.appendChild(el);
                });

                section.appendChild(timeline);
                return section;
            }

            function buildExperiencias(experiencias) {
                const section = newSection();
                section.appendChild(sectionTitle('fas fa-briefcase', pick(TITULOS.experiencias)));

                (experiencias.itens || []).forEach(function (item) {
                    const el = document.createElement('div');
                    el.className = 'experience-item';

                    const header = document.createElement('div');
                    header.className = 'experience-header';

                    const cargo = document.createElement('div');
                    cargo.className = 'experience-position';
                    cargo.textContent = tr(item, 'cargo');
                    header.appendChild(cargo);

                    const situacao = tr(item, 'situacao');
                    if (situacao) {
                        const status = document.createElement('div');
                        status.className = 'experience-status';
                        status.textContent = situacao;
                        header.appendChild(status);
                    }

                    el.appendChild(header);

                    if (item.instituicao) {
                        const inst = document.createElement('div');
                        inst.className = 'experience-institution';
                        inst.textContent = item.instituicao;
                        el.appendChild(inst);
                    }

                    section.appendChild(el);
                });

                return section;
            }

            function render() {
                if (!data) return;

                const identidade = data.identidade || {};
                const nome = identidade.nome || '';

                document.documentElement.lang = lang;
                document.title = (nome || 'Cartão de visita') + ' - ' + tr(identidade, 'especialidade');

                const photo = document.getElementById('profile-photo');
                photo.style.backgroundImage = identidade.foto ? 'url("' + identidade.foto + '")' : '';

                document.getElementById('doctor-name').textContent = nome;
                document.getElementById('specialty').textContent = tr(identidade, 'especialidade');

                contentEl.innerHTML = '';
                if (data.contatos) contentEl.appendChild(buildContatos(data.contatos));
                if (data.resumo) contentEl.appendChild(buildResumo(data.resumo));
                if (data.formacao) contentEl.appendChild(buildFormacao(data.formacao));
                if (data.experiencias) contentEl.appendChild(buildExperiencias(data.experiencias));

                footerEl.textContent = '© ' + new Date().getFullYear() + ' ' + nome + '. ' + pick(RODAPE);

                langButtons.forEach(function (btn) {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });
            }

            function showError(message) {
                statusEl.className = 'status-message error';
                statusEl.textContent = message;
            }

            langButtons.forEach(function (button) {
                button.addEventListener('click', function () {
                    lang = button.dataset.lang;
                    localStorage.setItem('preferredLanguage', lang);
                    render();
                });
            });

            Promise.all(Object.keys(CONTENT_FILES).map(function (key) {
                return fetch(CONTENT_FILES[key], { cache: 'no-cache' })
                    .then(function (response) {
                        if (!response.ok) throw new Error(CONTENT_FILES[key] + ': HTTP ' + response.status);
                        return response.json();
                    })
                    .then(function (json) {
                        return [key, json];
                    })
                    .catch(function (error) {
                        console.error('Falha ao carregar o conteúdo:', error);
                        return [key, null];
                    });
            })).then(function (results) {
                data = {};
                results.forEach(function (result) {
                    data[result[0]] = result[1];
                });

                if (!data.identidade) {
                    showError('Não foi possível carregar content/identidade.json. Se você abriu o arquivo direto no computador, use um servidor local ou acesse o site publicado.');
                    return;
                }

                render();
            });

            // Compartilhamento
            const shareBtn = document.getElementById('share-btn');
            shareBtn.addEventListener('click', async function () {
                const identidade = (data && data.identidade) || {};
                const especialidade = tr(identidade, 'especialidade');
                const shareData = {
                    title: identidade.nome || document.title,
                    text: especialidade ? especialidade + ' - Cartão de Visita Digital' : 'Cartão de Visita Digital',
                    url: window.location.href
                };

                try {
                    if (navigator.share) {
                        await navigator.share(shareData);
                    } else {
                        await navigator.clipboard.writeText(window.location.href);
                        alert(lang === 'es'
                            ? '¡Enlace del tarjeta copiado al portapapeles!'
                            : 'Link do cartão copiado para a área de transferência!');
                    }
                } catch (err) {
                    console.error('Erro ao compartilhar: ', err);
                }
            });
        })();
    </script>

    <!-- Login por email/senha: usado apenas nos links de convite do Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on('init', function (user) {
                if (!user) {
                    window.netlifyIdentity.on('login', function () {
                        document.location.href = '/admin/';
                    });
                }
            });
        }
    </script>
</body>
</html>
